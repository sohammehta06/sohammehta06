name: rebuild readme

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "NOW.md"
      - ".github/workflows/rebuild.yml"

permissions:
  contents: write

concurrency:
  group: rebuild-readme
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # a fine-grained PAT expires silently and every run after that renders an
      # empty profile. surface it as a warning in the run summary instead.
      - name: check token
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_TOKEN secret is not set — private contributions will be hidden."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/user)
          if [ "$code" != "200" ]; then
            echo "::warning::GH_TOKEN rejected (HTTP $code) — it has most likely expired. Regenerate it at https://github.com/settings/tokens?type=beta and update the repo secret. Falling back to public-only data."
          else
            echo "token ok"
          fi

      - name: build widgets
        env:
          # GH_TOKEN unlocks private contribution counts; GITHUB_TOKEN is the
          # always-present fallback so a dead PAT still produces a real page.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          python scripts/build_header.py
          python scripts/update_readme.py

      - name: commit
        run: |
          git config user.name "readme-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets/
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: rebuild readme [skip ci]"
            git push
          fi
