name: rebuild readme

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "NOW.md"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build contribution graph
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/build_graph.py

      - name: update readme
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/update_readme.py

      - name: commit
        run: |
          git config user.name "readme-bot"
          git config user.email "actions@github.com"
          git add README.md assets/
          if ! git diff --staged --quiet; then
            git commit -m "chore: rebuild readme"
            git push
          else
            echo "no changes"
          fi
